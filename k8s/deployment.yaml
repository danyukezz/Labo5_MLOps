apiVersion: apps/v1
kind: Deployment
metadata:
  name: animals-api
  namespace: default
  labels:
    app: animals-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: animals-api
  template:
    metadata:
      labels:
        app: animals-api
        version: v1
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: animals-api
        image: ghcr.io/danyukezz/mlops-animals-api:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PORT
          value: "8000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
