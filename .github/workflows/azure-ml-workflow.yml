name: Azure ML Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_training:
        description: 'Skip Azure ML training (download model only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_deployment:
        description: 'Skip Kubernetes deployment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_compute_creation:
        description: 'Skip compute machine creation (use existing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  GROUP: rg-azure-ai
  WORKSPACE: bordunov-danylo-ml
  LOCATION: westeurope

jobs:
  azure-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # CREATE WORKSPACE FIRST
      - name: Create Azure ML Workspace
        uses: Azure/CLI@v2.2.0
        with:
          azcliversion: 2.79.0
          inlineScript: |
            az extension add --name ml
            az ml workspace create \
              -n $WORKSPACE \
              -g $GROUP \
              -l $LOCATION
        continue-on-error: true

      # CREATE COMPUTE (only if doesn't exist)
      - name: Azure -- Create compute
        uses: Azure/CLI@v2.2.0
        with:
          azcliversion: 2.79.0
          inlineScript: |
            az extension add --name ml
            az configure --defaults group=$GROUP workspace=$WORKSPACE location=$LOCATION
            
            # Check if compute exists
            if az ml compute show --name compute-danylo 2>/dev/null; then
              echo "Compute 'compute-danylo' already exists. Skipping creation."
            else
              echo "Compute 'compute-danylo' not found. Creating inline..."
              
              # Create compute inline (no local file needed)
              az ml compute create \
                --name compute-danylo \
                --type ComputeInstance \
                --size Standard_DS2_v2 \
                --min-instances 1 \
                --max-instances 1 \
                --idle-time-before-scale-down 120
            fi

      # START COMPUTE (using existing machine)
      - name: Azure -- Check and Start Compute
        uses: Azure/CLI@v2.2.0
        with:
          azcliversion: 2.79.0
          inlineScript: |
            az extension add --name ml -y
            az configure --defaults group=$GROUP workspace=$WORKSPACE location=$LOCATION
            
            # Get compute state
            STATE=$(az ml compute show --name compute-danylo --query "state" -o tsv 2>/dev/null || echo "Unknown")
            
            # Only start if stopped
            if [ "$STATE" = "Stopped" ]; then
              echo "Starting compute..."
              az ml compute start --name compute-danylo
            else
              echo "Compute is already in state: $STATE. Skipping start."
            fi

      # ENVIRONMENT SETUP (only if folder exists)
      - name: Azure -- Environment Setup
        uses: Azure/CLI@v2.2.0
        with:
          azcliversion: 2.79.0
          inlineScript: |
            az extension add --name ml
            az configure --defaults group=$GROUP workspace=$WORKSPACE location=$LOCATION
            
            # Check if environment folder exists
            if [ -d "./environment" ]; then
              # Loop over all environment YAML files
              for env_file in ./environment/*.yaml; do
                # Check if file exists (not just glob pattern)
                if [ -f "$env_file" ]; then
                  # Skip compute.yaml as it's not an environment file
                  if [[ "$env_file" != *"compute.yaml"* ]]; then
                    echo "Creating environment from: $env_file"
                    az ml environment create --file "$env_file" || echo "Environment might already exist, continuing..."
                  fi
                fi
              done
            else
              echo "No ./environment folder found. Skipping environment setup."
            fi

      # COMPONENT SETUP (only if folder exists)
      - name: Azure -- Component Setup
        uses: Azure/CLI@v2.2.0
        with:
          azcliversion: 2.79.0
          inlineScript: |
            az extension add --name ml
            az configure --defaults group=$GROUP workspace=$WORKSPACE location=$LOCATION
            
            # Check if components folder exists
            if [ -d "./components" ]; then
              # Only register actual component YAML files (not conda.yaml)
              find ./components -name "*.yaml" -type f 2>/dev/null | while read component_file; do
                # Skip conda.yaml files as they are environment files, not components
                if [[ "$component_file" != *"conda.yaml"* ]] && [ -f "$component_file" ]; then
                  echo "Creating component from: $component_file"
                  az ml component create --file "$component_file" || echo "Component might already exist, continuing..."
                fi
              done
            else
              echo "No ./components folder found. Skipping component setup."
              echo "Pipeline will use existing components with @latest label."
            fi

      # RUN PIPELINE
      - name: Azure -- Pipeline Run
        if: ${{ inputs.skip_training != 'true' }}
        uses: Azure/CLI@v2.2.0
        with:
          azcliversion: 2.79.0
          inlineScript: |
            az extension add --name ml
            az configure --defaults group=$GROUP workspace=$WORKSPACE location=$LOCATION
            # Version tagging: Tag the pipeline with GitHub SHA for traceability
            az ml job create --file ./pipelines/animals-classification.yaml --stream --set name=animals-classification-${{ github.sha }}-${{ github.run_id }} --set tags.github_sha=${{ github.sha }} --set tags.github_ref=${{ github.ref }}

      # CLEANUP - STOP COMPUTE
      - name: Azure -- Stop Compute
        uses: Azure/CLI@v2.2.0
        with:
          azcliversion: 2.79.0
          inlineScript: |
            az extension add --name ml
            az configure --defaults group=$GROUP workspace=$WORKSPACE location=$LOCATION
            az ml compute stop --name compute-danylo
        continue-on-error: true

      - name: Azure Logout
        run: |
          az logout
        if: always()

  download: 
    needs: azure-pipeline
    runs-on: ubuntu-24.04
    if: ${{ inputs.skip_training != 'true' || github.event_name == 'push' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure -- Download Model
        uses: Azure/CLI@v2.2.0 
        with:
          azcliversion: 2.79.0
          inlineScript: |
            az extension add --name ml -y
            az configure --defaults group=$GROUP workspace=$WORKSPACE location=$LOCATION
            VERSION=$(az ml model list -n animals-classifier-model --query "[0].version" -o tsv)
            az ml model download -n animals-classifier-model -v $VERSION --download-path ./artifact-model
      
      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: trained-model
          path: artifact-model
    
      - name: Docker -- Upload API code from Inference
        uses: actions/upload-artifact@v4.3.3
        with:
          name: docker-config
          path: inference

  deploy:
    needs: download
    runs-on: self-hosted
    if: ${{ inputs.skip_deployment != 'true' }}
    env:
      KUBECONFIG: /Users/danyukezz/.kube/config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # DOCKER - Gather Tags
      - name: Docker -- Gather Tags
        id: docker-meta-data
        uses: docker/metadata-action@v5.5.1
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/danyukezz/mlops-animals-api
          # generate Docker tags based on the following events/attributes:
          # The GitHub Branch
          # The GitHub SHA (for complete traceability)
          # Semantic versioning based on branch/tag
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # DOCKER - Login to GHCR
      - name: Docker -- Login to GHCR
        uses: docker/login-action@v3.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKER - Download API Code for Inference
      - name: Docker -- Download API Code for Inference
        uses: actions/download-artifact@v4.1.7
        with:
          name: docker-config
          path: inference

      # DOCKER - Download Model
      - name: Docker -- Download Trained Model
        uses: actions/download-artifact@v4.1.7
        with:
          name: trained-model
          path: inference/model

      # DOCKER - Build and Push
      - name: Docker Build and push
        id: docker_build
        uses: docker/build-push-action@v5.3.0
        with:
          context: ./inference
          push: true
          tags: ${{ steps.docker-meta-data.outputs.tags }}

      # KUBERNETES - Setup kubectl config
      - name: Kubernetes -- Setup Config
        run: |
          # Debug: Show environment
          echo "HOME: $HOME"
          echo "USER: $USER"
          ls -la ~/.kube/config || echo "Kubeconfig not found at ~/.kube/config"
          
          # Verify kubectl is configured
          kubectl cluster-info || echo "⚠️ Kubectl not configured. Please set up kubeconfig."
          kubectl version --client
      
      # KUBERNETES - Deploy Application
      - name: Kubernetes -- Deploy to Cluster
        run: |
          # Log version information for traceability
          echo "🚀 Deploying Animals API"
          echo "📦 GitHub SHA: ${{ github.sha }}"
          echo "📋 GitHub Ref: ${{ github.ref }}"
          echo "🔗 Run ID: ${{ github.run_id }}"
          
          # Apply Kubernetes manifests
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          
          # Wait for deployment to be ready
          kubectl rollout status deployment/animals-api --timeout=5m
          
          # Display deployment info
          kubectl get deployments
          kubectl get services
          kubectl get pods
          
          echo "✅ Deployment complete! Model version tagged with SHA: ${{ github.sha }}"