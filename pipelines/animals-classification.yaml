$schema: https://azuremlschemas.azureedge.net/latest/pipeline.schema.json

type: pipeline
name: animals-classification-cli
display_name: Animals Classification
experiment_name: classification

inputs:
  train_test_split_factor: 20
  epochs: 5
  batch_size: 32
  learning_rate: 0.001
  patience: 5
  seed: 42

outputs:
  model: 
    mode: upload
  registration_details:
    mode: upload

settings:
  default_compute: azureml:compute-danylo

jobs:
  data_prep_pandas:
    type: command
    component: azureml:data_prep_image_resize@latest
    inputs:
      data: 
        type: uri_folder
        path: azureml:pandas:1

    outputs:
      output_data: 
        mode: rw_mount

  data_prep_cats:
    type: command
    component: azureml:data_prep_image_resize@latest
    inputs:
      data: 
        type: uri_folder
        path: azureml:cats:1

    outputs:
      output_data: 
        mode: rw_mount

  data_prep_dogs:
    type: command
    component: azureml:data_prep_image_resize@latest
    inputs:
      data: 
        type: uri_folder
        path: azureml:dogs:1

    outputs:
      output_data: 
        mode: rw_mount

  data_split:
    type: command
    component: azureml:data_split@latest
    inputs:
      animal_1: ${{parent.jobs.data_prep_pandas.outputs.output_data}}
      animal_2: ${{parent.jobs.data_prep_cats.outputs.output_data}}
      animal_3: ${{parent.jobs.data_prep_dogs.outputs.output_data}}
      train_test_split_factor: ${{parent.inputs.train_test_split_factor}}
    outputs:
      testing_data:
        mode: rw_mount
      training_data:
        mode: rw_mount

  training:
    type: command
    component: azureml:training@latest
    inputs:
      training_folder: ${{parent.jobs.data_split.outputs.training_data}}
      testing_folder: ${{parent.jobs.data_split.outputs.testing_data}}
      epochs: ${{parent.inputs.epochs}}
      batch_size: ${{parent.inputs.batch_size}}
      learning_rate: ${{parent.inputs.learning_rate}}
      patience: ${{parent.inputs.patience}}
      seed: ${{parent.inputs.seed}}
      model_name: animal-classifier
    outputs:
      output_model: ${{parent.outputs.model}}

  register:
    type: command
    component: azureml://registries/azureml/components/register_model/versions/0.0.21
    inputs:
      model_name: animal-classification
      model_type: custom_model
      model_path: ${{parent.jobs.training.outputs.output_model}}
    outputs:
      registration_details_folder: ${{ parent.outputs.registration_details }}